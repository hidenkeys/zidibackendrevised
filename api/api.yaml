    CreateCommerceCategoryRequest:
      type: object
      required:
        - name
        - slug
        - sort_order
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
          default: ""
        sort_order:
          type: integer
          minimum: 0

    UpdateCommerceCategoryRequest:
      type: object
      required: [name, slug, sort_order, status]
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
        sort_order:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, inactive]

    CommerceCategory:
      type: object
      required:
        - id
        - organization_id
        - name
        - slug
        - description
        - sort_order
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCommerceProductRequest:
      type: object
