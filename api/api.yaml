          maxLength: 3
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CommerceProductVariantInput"
        images:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductImageInput"

    CommerceProductVariantInput:
      type: object
      required:
        - name
        - sku
        - price_minor
        - is_default
      properties:
        name:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        price_minor:
          type: integer
          format: int64
          minimum: 0
        attributes:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean

    UpdateCommerceProductRequest:
      type: object
      required: [category_id, name, slug, currency, status]
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          type: string
          enum: [active, inactive]
        images:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductImageInput"

    UpdateCommerceProductVariantRequest:
      type: object
      required: [name, price_minor, status]
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
        price_minor:
          type: integer
          format: int64
          minimum: 0
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [active, inactive]

    CommerceProductImageInput:
      type: object
      required:
        - url
        - sort_order
      properties:
        url:
          type: string
          format: uri
        alt_text:
          type: string
          default: ""
        sort_order:
          type: integer
          minimum: 0

    CommerceProductImageUpload:
      type: object
      required: [url, public_id, width, height, format]
      properties:
        url:
          type: string
          format: uri
        public_id:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        format:
          type: string

    CommerceProduct:
      type: object
      required:
        - id
        - organization_id
        - category_id
        - name
        - slug
        - description
        - currency
        - status
        - variants
        - images
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [active, inactive]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductVariant"
        images:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductImage"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommerceProductVariant:
      type: object
      required:
        - id
        - product_id
        - name
        - sku
        - price_minor
        - attributes
        - is_default
        - status
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        price_minor:
          type: integer
          format: int64
        attributes:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, inactive]

    CommerceProductImage:
      type: object
      required:
        - id
        - url
        - alt_text
        - sort_order
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        alt_text:
          type: string
        sort_order:
          type: integer

    CommerceProductList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProduct"
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    ConfigureCommerceStoreVariantRequest:
      type: object
      required:
        - enabled
        - reorder_threshold
      properties:
        organization_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        price_override_minor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        reorder_threshold:
